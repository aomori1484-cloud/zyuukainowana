<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>住改のWANA - 住宅改修支援アプリ</title>
    <meta name="description" content="住宅改修支援アプリ - 手すりシミュレーション＆平面図生成" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="住改WANA" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <script type="module" crossorigin src="./assets/index-BTodSPvh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-gwoVBjCU.css">
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
    <script>
      // Service Worker登録（PWAオフライン対応）
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('SW registered:', reg.scope);
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
